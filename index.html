<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hex Calendar Puzzle</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0d1117;
      --surface:    #161b27;
      --surface2:   #1e253a;
      --border:     #2e3a52;
      --border-hi:  #4a5e80;
      --text:       #c9d6e8;
      --text-muted: #5a6e8a;
      --accent:     #c8941a;
      --accent-hi:  #f0b84a;
      --danger:     #e05555;
      --success:    #4caf50;
      --radius:     8px;
      --mono:       'Courier New', Courier, monospace;
      --ui:         -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    body {
      font-family: var(--ui);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 48px;
    }

    header { text-align: center; margin-bottom: 22px; }

    h1 {
      font-family: var(--mono);
      font-size: clamp(16px, 4vw, 24px);
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 5px;
    }

    .tagline {
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .controls {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
      align-items: flex-end;
      justify-content: center;
      margin-bottom: 16px;
      width: 100%;
      max-width: 740px;
    }

    .cg { display: flex; flex-direction: column; gap: 5px; }

    label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    select {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 14px;
      font-family: var(--ui);
      padding: 8px 14px;
      cursor: pointer;
      outline: none;
      min-width: 82px;
      transition: border-color 0.15s;
      appearance: auto;
    }
    select:hover, select:focus { border-color: var(--border-hi); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--ui);
      font-size: 14px;
      height: 38px;
      padding: 8px 14px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      white-space: nowrap;
    }
    .btn:hover { background: #252f47; border-color: var(--border-hi); }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .btn.primary {
      background: #2a1e00;
      border-color: var(--accent);
      color: var(--accent-hi);
      font-weight: 600;
    }
    .btn.primary:hover { background: #3a2800; }

    .btn svg {
      width: 15px; height: 15px;
      stroke: currentColor; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
      flex-shrink: 0;
    }

    .btn-symbol { font-size: 20px; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      display: none;
      width: 15px; height: 15px;
      border: 2px solid transparent;
      border-top-color: var(--accent-hi);
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
    }

    #output {
      font-size: 13px;
      font-family: var(--mono);
      color: var(--text-muted);
      text-align: center;
      min-height: 20px;
      margin-bottom: 14px;
      letter-spacing: 0.4px;
      transition: color 0.2s;
    }
    #output.solved  { color: var(--success); font-weight: 700; }
    #output.error   { color: var(--danger); }
    #output.loading { color: var(--accent-hi); }

    /* ── merged board + tray box ─────────────────────────── */
    .puzzle-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px 14px;
      width: 100%;
      max-width: 740px;
      margin-bottom: 8px;
    }

    .puzzle-title {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .puzzle-hint {
      font-size: 11px;
      color: var(--text-muted);
      font-style: italic;
    }

    .puzzle-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      width: 100%;
      max-width: 740px;
      position: relative;
      transition: opacity 0.2s;
    }

    #board, #board * {
      touch-action: none;
    }

    #board {
      display: block;
      width: 100%;
      height: auto;
    }

    .piece-group { cursor: grab; touch-action: none; }
    .piece-group.dragging { cursor: grabbing; }
    .piece-group .rot-btn-bg { fill: var(--surface2); stroke: var(--border); }
    .piece-group .rot-btn-txt { fill: var(--text-muted); }
    .piece-group:hover .rot-btn-bg { stroke: var(--border-hi); }

    .drop-valid   { filter: drop-shadow(0 0 6px rgba(76,175,80,0.9)); }
    .drop-invalid { filter: drop-shadow(0 0 6px rgba(224,85,85,0.9)); }

    .legend {
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
      justify-content: center;
      max-width: 740px;
    }

    .li {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .sw {
      width: 13px; height: 13px;
      border-radius: 3px;
      border: 1px solid rgba(255,255,255,0.1);
      flex-shrink: 0;
    }

    @media (max-width: 480px) {
      .controls { padding: 10px 12px; gap: 8px 12px; }
      select { font-size: 13px; padding: 6px 8px; min-width: 72px; }
      .btn { font-size: 12px; padding: 7px 10px; }
    }
  </style>
</head>
<body>

<header>
  <h1>Calendar Puzzle</h1>
  <p class="tagline">Cover every hex — leave month, day &amp; weekday exposed</p>
</header>

<div class="controls">
  <div class="cg">
    <label for="selMonth">Month</label>
    <select id="selMonth">
      <option>Jan</option><option>Feb</option><option>Mar</option>
      <option>Apr</option><option>May</option><option>Jun</option>
      <option>Jul</option><option>Aug</option><option>Sep</option>
      <option>Oct</option><option>Nov</option><option>Dec</option>
    </select>
  </div>
  <div class="cg">
    <label for="selDay">Day</label>
    <select id="selDay"></select>
  </div>
  <div class="cg">
    <label for="selWeekday">Weekday</label>
    <select id="selWeekday">
      <option>Sun</option><option>Mon</option><option>Tue</option>
      <option>Wed</option><option>Thu</option><option>Fri</option><option>Sat</option>
    </select>
  </div>
  <div class="cg" style="flex-direction:row;gap:7px;align-items:flex-end;">
    <button class="btn" id="todayBtn">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg>
      Today
    </button>
    <button class="btn primary" id="solveButton">
      <span class="spinner" id="spinner"></span>
      <svg id="solveIcon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      Solve
    </button>
    <button class="btn" id="resetBtn">
      <span class="btn-symbol">⟲</span>Reset
    </button>
  </div>
</div>

<div id="output">Choose a date above, then drag pieces or hit Solve</div>

<div class="puzzle-header">
  <span class="puzzle-title">Board &amp; pieces</span>
  <span class="puzzle-hint">Drag pieces anywhere in the box · scroll or tap ↻ ↺ to rotate · drag a placed piece to move or remove it</span>
</div>

<div class="puzzle-box" id="puzzleBox">
  <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>
</div>

<div class="legend" id="legend"></div>

<script>
"use strict";

const BOARD = [
    [  "7",    "",  "20",  null,  null,  null,  null,  null],
    ["Jan",   "9",  "15", "Jul",  null,  null,  null,  null],
    ["Feb", "Mon",  "11",  "21", "Aug",  null,  null,  null],
    ["Mar",   "4", "Tue",  "16",  "26", "Sep",  null,  null],
    [ null,   "2", "Wed",  "12",  "22",  "29",  null,  null],
    [ null,   "1",   "5", "Thu",  "17",  "27",  "31",  null],
    [ null,  null,   "3", "Fri",  "13",  "23",  "30",  null],
    [ null,  null, "Apr",   "6", "Sat",  "18",  "28", "Oct"],
    [ null,  null,  null, "May", "Sun",  "14",  "24", "Nov"],
    [ null,  null,  null,  null, "Jun",  "10",  "19", "Dec"],
    [ null,  null,  null,  null,  null,   "8",    "",  "25"],
];

function boardToSolution(board, targetMonth, targetDay, targetWeekday) {
    const rows = board.length;
    const cols = board[0].length;
    const solution = Array.from({length: rows}, () => Array(cols).fill(0));
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            const val = board[r][c];
            if (val === null) {
                solution[r][c] = -1;
            } else if (val === targetMonth || val === targetDay || val === targetWeekday) {
                solution[r][c] = -2;
            }
        }
    }
    return solution;
}

const PIECES = {
             "Elbow": [[0,0], [1,0], [2,1]],
            "3-Line": [[0,0], [1,0], [2,0]],
          "Triangle": [[0,0], [1,0], [1,1]],
           "Rhombus": [[0,0], [1,0], [1,1], [0,1]],
            "4-Line": [[0,0], [1,0], [2,0], [3,0]],
                 "C": [[0,0], [1,0], [2,1], [2,2]],
                 "P": [[0,0], [1,0], [2,0], [2,1]],
          "Mirror P": [[0,0], [0,1], [0,2], [1,2]],
                 "L": [[0,0], [0,1], [0,2], [1,3]],
          "Mirror L": [[0,0], [0,1], [0,2], [1,0]],
           "Zig-Zag": [[0,0], [1,0], [2,1], [3,1]],
    "Mirror Zig-Zag": [[0,0], [1,1], [2,1], [3,2]],
          "Triforce": [[0,0], [1,1], [2,1], [1,2]]
};

function generateUniqueRotations(basePiece) {
    const rotations = [];
    const seen = new Set();
    let currentPiece = basePiece.map(c => [...c]);
    for (let i = 0; i < 6; i++) {
        const rotated = currentPiece.map(([x, y]) => [x - y, x]);
        const [x0, y0] = rotated[0];
        const anchored = rotated.map(([x, y]) => [x - x0, y - y0]);
        const minX = Math.min(...anchored.map(([x]) => x));
        const minY = Math.min(...anchored.map(([,y]) => y));
        const normalized = anchored.map(([x, y]) => [x - minX, y - minY]).sort();
        const key = JSON.stringify(normalized);
        if (!seen.has(key)) {
            seen.add(key);
            rotations.push(anchored);
        }
        currentPiece = rotated;
    }
    return rotations;
}

const PIECE_ROTATIONS = Object.fromEntries(
    Object.entries(PIECES).map(([name, coords]) => [name, generateUniqueRotations(coords)])
);

const NEIGHBOR_COORDS = [[-1,0], [1,0], [0,-1], [0,1], [1,1], [-1,-1]];

class PuzzleSolver {
    constructor(board, targetMonth, targetDay, targetWeekday) {
        this.board = board;
        this.targetMonth = targetMonth;
        this.targetDay = targetDay;
        this.targetWeekday = targetWeekday;
        this.rows = board.length;
        this.cols = board[0].length;
        this.solution = [];
        this.usedPieces = {};
        this.solverSetup();
    }

    solverSetup() {
        this.solution = boardToSolution(BOARD, this.targetMonth, this.targetDay, this.targetWeekday);
        this.usedPieces = Object.fromEntries(Object.entries(PIECES).map(([name]) => [name, false]));
    }

    hasUnfillableHoles() {
        const visited = Array.from({length: this.rows}, () => Array(this.cols).fill(false));
        for (let r = 0; r < this.rows; r++) {
            for (let c = 0; c < this.cols; c++) {
                if (this.solution[r][c] !== 0 || visited[r][c]) continue;
                let size = 0;
                const queue = [[r, c]];
                visited[r][c] = true;
                while (queue.length) {
                    const [cr, cc] = queue.shift();
                    size++;
                    for (const [dr, dc] of NEIGHBOR_COORDS) {
                        const nr = cr + dr, nc = cc + dc;
                        if (nr >= 0 && nr < this.rows && nc >= 0 && nc < this.cols &&
                            this.solution[nr][nc] === 0 && !visited[nr][nc]) {
                            visited[nr][nc] = true;
                            queue.push([nr, nc]);
                        }
                    }
                }
                if ([1, 2, 5, 7].includes(size)) return true;
            }
        }
        return false;
    }

    solve() {
        if (this.hasUnfillableHoles()) return false;
        let target = null;
        for (let r = 0; r < this.rows && !target; r++)
            for (let c = 0; c < this.cols && !target; c++)
                if (this.solution[r][c] === 0) target = [r, c];
        if (!target) return true;
        const [rTarget, cTarget] = target;
        for (const [idx, name] of Object.keys(this.usedPieces).entries()) {
            if (this.usedPieces[name]) continue;
            for (const orientation of PIECE_ROTATIONS[name]) {
                for (const [rPivot, cPivot] of orientation) {
                    const placed = [];
                    let canPlace = true;
                    for (const [dx, dy] of orientation) {
                        const nr = rTarget + dx - rPivot;
                        const nc = cTarget + dy - cPivot;
                        if (nr >= 0 && nr < this.rows && nc >= 0 && nc < this.cols &&
                            this.solution[nr][nc] === 0) {
                            placed.push([nr, nc]);
                        } else {
                            canPlace = false;
                            break;
                        }
                    }
                    if (!canPlace) continue;
                    for (const [pr, pc] of placed) this.solution[pr][pc] = idx + 1;
                    this.usedPieces[name] = true;
                    if (this.solve()) return true;
                    this.usedPieces[name] = false;
                    for (const [pr, pc] of placed) this.solution[pr][pc] = 0;
                }
            }
        }
        return false;
    }
}

function solveCalendar(month, day, weekday) {
    const solver = new PuzzleSolver(BOARD, month, day, weekday);
    return { solved: solver.solve(), solution: solver.solution };
}

const COLORS = {
    "-2": "#000000", "-1": "none", "0": "#ffffff",
     "1": "#ff0000",  "2": "#00ff00",  "3": "#78009D",
     "4": "#ff9b54",  "5": "#00a3c7",  "6": "#ff00f2",
     "7": "#ffa5c4",  "8": "#126E75",  "9": "#b778ff",
    "10": "#9A5B12", "11": "#620000", "12": "#FBFF00", "13": "#aaffc3",
};

const HEX_RADIUS = 30;

function hexPoints(cx, cy) {
    const points = [];
    for (let i = 0; i < 6; i++) {
        const ang = (Math.PI / 180) * (60 * i);
        points.push(`${cx + HEX_RADIUS * Math.cos(ang)},${cy + HEX_RADIUS * Math.sin(ang)}`);
    }
    return points.join(" ");
}

// boardToPixel(row, col): row drives x-axis, col drives y-axis (with shear)
// x = 1.5 * R * row
// y = sqrt(3) * R * (col - row/2)
function boardToPixel(row, col) {
    return [
        1.5 * HEX_RADIUS * row,
        Math.sqrt(3) * HEX_RADIUS * (col - row / 2)
    ];
}

function makeSVG(tag) {
    return document.createElementNS("http://www.w3.org/2000/svg", tag);
}

/* ═══════════════════════════════════════════════════════════
   Merged board + tray layout
   The whole SVG is one shared coordinate space: the calendar
   grid occupies the top region, and the open "tray" region
   below it is free space where loose pieces can be dropped
   anywhere.
═══════════════════════════════════════════════════════════ */
const PIECE_NAMES = Object.keys(PIECES);

function computeLayout() {
    // Natural (unshifted) board bounding box, using the raw boardToPixel formula.
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (let r = 0; r < BOARD.length; r++) {
        for (let c = 0; c < BOARD[r].length; c++) {
            if (BOARD[r][c] === null) continue;
            const [x, y] = boardToPixel(r, c);
            minX = Math.min(minX, x - HEX_RADIUS);
            maxX = Math.max(maxX, x + HEX_RADIUS);
            minY = Math.min(minY, y - HEX_RADIUS);
            maxY = Math.max(maxY, y + HEX_RADIUS);
        }
    }
    const boardW = maxX - minX, boardH = maxY - minY;
    const trayCols = 4;
    const slot = 150;
    const trayRows = Math.ceil(PIECE_NAMES.length / trayCols);
    const trayW = trayCols * slot;
    const trayH = trayRows * slot;
    const gap = 26;
    const pad = 16;
    const totalW = Math.max(boardW, trayW);
    const totalH = boardH + gap + trayH;

    // BOARD_ORIGIN maps raw boardToPixel(row,col) output into world space,
    // shifted so the board is horizontally centered within totalW and
    // top-aligned at world y = 0.
    const boardOrigin = {
        x: (totalW - boardW) / 2 - minX,
        y: -minY
    };

    // Tray region is likewise centered within totalW, placed below the board.
    const trayX0 = (totalW - trayW) / 2;
    const trayY0 = boardH + gap;

    return {
        boardOrigin,
        boardMinX: (totalW - boardW) / 2, boardMaxX: (totalW - boardW) / 2 + boardW,
        boardMinY: 0, boardMaxY: boardH,
        trayX0, trayY0, trayCols, trayRows, slot,
        viewX: -pad, viewY: -pad,
        viewW: totalW + pad * 2, viewH: totalH + pad * 2
    };
}

const LAYOUT = computeLayout();
const BOARD_ORIGIN = LAYOUT.boardOrigin;

function initSVG() {
    const svg = document.getElementById("board");
    svg.innerHTML = "";
    svg.setAttribute("viewBox", `${LAYOUT.viewX} ${LAYOUT.viewY} ${LAYOUT.viewW} ${LAYOUT.viewH}`);
    const boardLayer = makeSVG("g");
    boardLayer.id = "boardLayer";
    svg.appendChild(boardLayer);
    const freeLayer = makeSVG("g");
    freeLayer.id = "freeLayer";
    svg.appendChild(freeLayer);
}

function drawBoard(board) {
    const layer = document.getElementById("boardLayer");
    layer.innerHTML = "";

    for (let row = 0; row < board.length; row++) {
        for (let col = 0; col < board[row].length; col++) {
            const cell = board[row][col];
            if (cell === -1) continue;

            const [rawX, rawY] = boardToPixel(row, col);
            const x = rawX + BOARD_ORIGIN.x, y = rawY + BOARD_ORIGIN.y;

            const poly = makeSVG("polygon");
            poly.setAttribute("points", hexPoints(x, y));
            poly.setAttribute("fill", COLORS[cell]);
            poly.setAttribute("stroke", "black");
            poly.setAttribute("stroke-width", "2");
            if (cell > 0) {
                poly.style.cursor = "grab";
                poly.dataset.row = row;
                poly.dataset.col = col;
                poly.addEventListener("pointerdown", onBoardPieceDragStart, {passive: false});
            }
            layer.appendChild(poly);

            const text = makeSVG("text");
            text.setAttribute("x", x);
            text.setAttribute("y", y);
            text.setAttribute("text-anchor", "middle");
            text.setAttribute("dominant-baseline", "middle");
            text.setAttribute("dy", "0.05em");
            text.setAttribute("font-size", String(HEX_RADIUS / 1.75));
            text.setAttribute("font-family", "Arial");
            text.setAttribute("fill", cell === -2 ? "white" : "black");
            text.textContent = BOARD[row][col];
            if (cell > 0) {
                text.style.cursor = "grab";
                text.dataset.row = row;
                text.dataset.col = col;
                text.addEventListener("pointerdown", onBoardPieceDragStart, {passive: false});
            }
            layer.appendChild(text);
        }
    }
}

/* ═══════════════════════════════════════════════════════════
   Manual play state
═══════════════════════════════════════════════════════════ */
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const WEEKDAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

let manualState = [];
let pieceStates = [];
let isAutoSolved = false;

function getPieceCells(pieceIdx, rotIdx) {
    const name = PIECE_NAMES[pieceIdx];
    const rots = PIECE_ROTATIONS[name];
    return rots[rotIdx % rots.length];
}

function initManualState() {
    const m = selMonth.value, d = selDay.value, w = selWeekday.value;
    manualState = boardToSolution(BOARD, m, d, w);
    // Preserve free (x,y) positions across date changes where possible, else assign defaults.
    pieceStates = PIECE_NAMES.map((_, i) => ({
        rotIdx: pieceStates[i] ? pieceStates[i].rotIdx : 0,
        placed: false,
        x: pieceStates[i] ? pieceStates[i].x : undefined,
        y: pieceStates[i] ? pieceStates[i].y : undefined
    }));
    isAutoSolved = false;
}

function redrawBoard() { drawBoard(manualState); }

function removePieceFromBoard(pieceIdx) {
    const ps = pieceStates[pieceIdx];
    if (!ps.placed) return;
    const cells = getPieceCells(pieceIdx, ps.rotIdx);
    const coords = cells.map(([dr, dc]) => [ps.anchorRow + dr, ps.anchorCol + dc]);
    const colorIdx = pieceIdx + 1;
    for (const [r, c] of coords) {
        if (manualState[r] && manualState[r][c] === colorIdx) manualState[r][c] = 0;
    }
    ps.placed = false;
}

// Picking up a piece that's already snapped onto the board: detach it from
// the board (without visually moving it) and hand off straight into the
// normal free-drag flow, so it can be dropped on a new cell or out in the
// open box.
function onBoardPieceDragStart(e) {
    if (dragPieceIdx >= 0) return; // a drag is already in progress on another finger
    e.preventDefault();
    const r = parseInt(e.target.dataset.row);
    const c = parseInt(e.target.dataset.col);
    if (isNaN(r) || isNaN(c)) return;
    const colorIdx = manualState[r][c];
    if (colorIdx <= 0) return;
    const pieceIdx = colorIdx - 1;
    const ps = pieceStates[pieceIdx];

    // Compute the piece's current world position (matches where it's drawn
    // on the board right now) so it doesn't jump when it becomes "free".
    const b = pieceLocalBounds(pieceIdx, ps.rotIdx);
    const [rawAnchorX, rawAnchorY] = boardToPixel(ps.anchorRow, ps.anchorCol);
    const anchorWorldX = rawAnchorX + BOARD_ORIGIN.x, anchorWorldY = rawAnchorY + BOARD_ORIGIN.y;
    ps.x = anchorWorldX - b.pts[0][0] + b.cx;
    ps.y = anchorWorldY - b.pts[0][1] + b.cy;

    removePieceFromBoard(pieceIdx);
    redrawBoard();
    renderFreePieces();

    const [cx, cy] = getClientXY(e);
    beginDrag(pieceIdx, cx, cy, e.pointerId, e.target);
}

function tryPlacePiece(pieceIdx, cells, anchorRow, anchorCol) {
    const colorIdx = pieceIdx + 1;
    const coords = cells.map(([dr, dc]) => [anchorRow + dr, anchorCol + dc]);
    for (const [r, c] of coords) {
        if (r < 0 || r >= manualState.length || c < 0 || c >= manualState[0].length) return false;
        if (manualState[r][c] !== 0) return false;
    }
    for (const [r, c] of coords) manualState[r][c] = colorIdx;
    const ps = pieceStates[pieceIdx];
    ps.placed = true;
    ps.anchorRow = anchorRow;
    ps.anchorCol = anchorCol;
    return true;
}

function checkWin() {
    for (let r = 0; r < manualState.length; r++)
        for (let c = 0; c < manualState[r].length; c++)
            if (manualState[r][c] === 0) return false;
    return true;
}

/* ═══════════════════════════════════════════════════════════
   Free piece rendering (loose pieces anywhere in the box)
═══════════════════════════════════════════════════════════ */
function pieceLocalBounds(pieceIdx, rotIdx) {
    const cells = getPieceCells(pieceIdx, rotIdx);
    const pts = cells.map(([r, c]) => boardToPixel(r, c));
    const minX = Math.min(...pts.map(p => p[0]));
    const maxX = Math.max(...pts.map(p => p[0]));
    const minY = Math.min(...pts.map(p => p[1]));
    const maxY = Math.max(...pts.map(p => p[1]));
    return { cells, pts, minX, maxX, minY, maxY, cx: (minX + maxX) / 2, cy: (minY + maxY) / 2 };
}

function buildPieceGroup(pieceIdx, centerX, centerY) {
    const ps = pieceStates[pieceIdx];
    const color = COLORS[String(pieceIdx + 1)];
    const b = pieceLocalBounds(pieceIdx, ps.rotIdx);

    const g = makeSVG("g");
    g.setAttribute("class", "piece-group");
    g.setAttribute("transform", `translate(${centerX - b.cx},${centerY - b.cy})`);

    b.pts.forEach(([x, y]) => {
        const poly = makeSVG("polygon");
        poly.setAttribute("points", hexPoints(x, y));
        poly.setAttribute("fill", color);
        poly.setAttribute("stroke", "black");
        poly.setAttribute("stroke-width", "1.5");
        g.appendChild(poly);
    });

    const label = makeSVG("text");
    label.setAttribute("x", b.cx);
    label.setAttribute("y", b.maxY + 16);
    label.setAttribute("text-anchor", "middle");
    label.setAttribute("font-size", "11");
    label.setAttribute("font-family", "monospace");
    label.setAttribute("fill", "#5a6e8a");
    label.style.pointerEvents = "none";
    label.textContent = PIECE_NAMES[pieceIdx];
    g.appendChild(label);

    const btnY = b.minY - 11;
    const mkRotBtn = (dx, symbol, dir) => {
        const btn = makeSVG("g");
        btn.style.cursor = "pointer";
        const bg = makeSVG("circle");
        bg.setAttribute("class", "rot-btn-bg");
        bg.setAttribute("cx", b.cx + dx);
        bg.setAttribute("cy", btnY);
        bg.setAttribute("r", "9");
        const txt = makeSVG("text");
        txt.setAttribute("class", "rot-btn-txt");
        txt.setAttribute("x", b.cx + dx);
        txt.setAttribute("y", btnY);
        txt.setAttribute("text-anchor", "middle");
        txt.setAttribute("dominant-baseline", "middle");
        txt.setAttribute("dy", "0.05em");
        txt.setAttribute("font-size", "11");
        txt.style.pointerEvents = "none";
        txt.textContent = symbol;
        btn.appendChild(bg);
        btn.appendChild(txt);
        btn.addEventListener("pointerdown", e => e.stopPropagation());
        btn.addEventListener("click", e => { e.stopPropagation(); rotatePiece(pieceIdx, dir); });
        return btn;
    };
    g.appendChild(mkRotBtn(-16, "↺", -1));
    g.appendChild(mkRotBtn(16, "↻", 1));

    g.title = `${PIECE_NAMES[pieceIdx]} — drag anywhere, scroll or tap ↻↺ to rotate`;
    g.addEventListener("pointerdown", e => onPieceDragStart(e, pieceIdx), {passive: false});
    g.addEventListener("wheel", e => {
        e.preventDefault();
        rotatePiece(pieceIdx, e.deltaY > 0 ? 1 : -1);
    }, {passive: false});

    return g;
}

function renderFreePieces() {
    const layer = document.getElementById("freeLayer");
    layer.innerHTML = "";
    let slotIdx = 0;
    PIECE_NAMES.forEach((name, i) => {
        const ps = pieceStates[i];
        if (ps.placed) { slotIdx++; return; }
        if (ps.x === undefined || ps.y === undefined) {
            const col = slotIdx % LAYOUT.trayCols;
            const row = Math.floor(slotIdx / LAYOUT.trayCols);
            ps.x = LAYOUT.trayX0 + col * LAYOUT.slot + LAYOUT.slot / 2;
            ps.y = LAYOUT.trayY0 + row * LAYOUT.slot + LAYOUT.slot / 2;
        }
        slotIdx++;
        layer.appendChild(buildPieceGroup(i, ps.x, ps.y));
    });
}

function rotatePiece(pieceIdx, dir) {
    const ps = pieceStates[pieceIdx];
    const name = PIECE_NAMES[pieceIdx];
    const nRots = PIECE_ROTATIONS[name].length;
    ps.rotIdx = ((ps.rotIdx + dir) % nRots + nRots) % nRots;
    renderFreePieces();
}

/* ═══════════════════════════════════════════════════════════
   Drag & drop — pieces move freely within the shared SVG
   coordinate space; dropping on a valid board cell snaps the
   piece in, dropping anywhere else in the box just leaves it
   floating at that spot.
═══════════════════════════════════════════════════════════ */
let dragPieceIdx = -1;
let dragStart = null;
let activePointerId = null;

function getClientXY(e) {
    if (e.touches && e.touches.length) return [e.touches[0].clientX, e.touches[0].clientY];
    if (e.changedTouches && e.changedTouches.length) return [e.changedTouches[0].clientX, e.changedTouches[0].clientY];
    return [e.clientX, e.clientY];
}

function screenToLocal(cx, cy) {
    const svg = document.getElementById("board");
    const ctm = svg.getScreenCTM();
    if (!ctm) return null;
    const pt = svg.createSVGPoint();
    pt.x = cx; pt.y = cy;
    return pt.matrixTransform(ctm.inverse());
}

function onPieceDragStart(e, pieceIdx) {
    if (dragPieceIdx >= 0) return; // a drag is already in progress on another finger
    e.preventDefault();
    const [cx, cy] = getClientXY(e);
    beginDrag(pieceIdx, cx, cy, e.pointerId, e.target);
}

function beginDrag(pieceIdx, cx, cy, pointerId, captureEl) {
    const loc = screenToLocal(cx, cy);
    if (!loc) return;
    dragPieceIdx = pieceIdx;
    activePointerId = pointerId;
    const ps = pieceStates[pieceIdx];
    dragStart = { pointerX: loc.x, pointerY: loc.y, pieceX: ps.x, pieceY: ps.y };
    // Pointer capture keeps this exact pointer's events routed to us even if
    // it moves off the original element, and stops other browser gestures
    // (like page panning) from hijacking a single-finger drag.
    if (captureEl && captureEl.setPointerCapture && pointerId !== undefined) {
        try { captureEl.setPointerCapture(pointerId); } catch (err) {}
    }
    document.addEventListener("pointermove", onPieceDragMove, {passive: false});
    document.addEventListener("pointerup", onPieceDragEnd);
    document.addEventListener("pointercancel", onPieceDragEnd);
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function onPieceDragMove(e) {
    if (dragPieceIdx < 0) return;
    if (e.pointerId !== undefined && e.pointerId !== activePointerId) return;
    e.preventDefault();
    const [cx, cy] = getClientXY(e);
    const loc = screenToLocal(cx, cy);
    if (!loc) return;
    const dx = loc.x - dragStart.pointerX, dy = loc.y - dragStart.pointerY;
    const ps = pieceStates[dragPieceIdx];
    ps.x = clamp(dragStart.pieceX + dx, LAYOUT.viewX + 15, LAYOUT.viewX + LAYOUT.viewW - 15);
    ps.y = clamp(dragStart.pieceY + dy, LAYOUT.viewY + 15, LAYOUT.viewY + LAYOUT.viewH - 15);
    renderFreePieces();

    const hit = getHoveredBoardCell(dragPieceIdx);
    document.getElementById("board").setAttribute("class", hit ? (hit.valid ? "drop-valid" : "drop-invalid") : "");
}

function onPieceDragEnd(e) {
    if (e && e.pointerId !== undefined && e.pointerId !== activePointerId) return;
    document.removeEventListener("pointermove", onPieceDragMove);
    document.removeEventListener("pointerup", onPieceDragEnd);
    document.removeEventListener("pointercancel", onPieceDragEnd);
    activePointerId = null;
    document.getElementById("board").setAttribute("class", "");

    if (dragPieceIdx < 0) return;
    const pieceIdx = dragPieceIdx;
    const ps = pieceStates[pieceIdx];
    const cells = getPieceCells(pieceIdx, ps.rotIdx);
    const hit = getHoveredBoardCell(pieceIdx);

    if (hit && hit.valid) {
        if (tryPlacePiece(pieceIdx, cells, hit.anchorRow, hit.anchorCol)) {
            redrawBoard();
            renderFreePieces();
            if (checkWin()) {
                setStatus("🎉 Puzzle solved! Well done!", "solved");
            } else {
                const rem = pieceStates.filter(p => !p.placed).length;
                setStatus(`"${PIECE_NAMES[pieceIdx]}" placed · ${rem} piece${rem !== 1 ? "s" : ""} remaining`);
            }
        }
    } else {
        // Left as a loose piece wherever it was dropped in the box.
        renderFreePieces();
    }
    dragPieceIdx = -1;
    dragStart = null;
}

/* ─────────────────────────────────────────────────────────
   getHoveredBoardCell: figure out which board [row,col] a
   dragged piece's anchor cell (cells[0]) is currently sitting
   over, based on where the piece is actually rendered
   (pieceStates[i].x/y), not the raw cursor position — the two
   can differ since the piece is dragged from wherever it was
   grabbed, not necessarily its bounding-box center.

   boardToPixel(row, col) gives:
     x = 1.5 * R * row      →  row = x / (1.5 * R)
     y = √3 * R * (col - row/2)  →  col = y / (√3 * R) + row/2

   So to invert: compute rowF first from x, then colF from y+rowF.
───────────────────────────────────────────────────────── */
function getHoveredBoardCell(pieceIdx) {
    const ps = pieceStates[pieceIdx];
    const b = pieceLocalBounds(pieceIdx, ps.rotIdx);
    const cells = b.cells;

    // World position of the piece's anchor cell (cells[0]), matching
    // how buildPieceGroup positions the group: translate(ps.x - b.cx, ps.y - b.cy)
    const originX = ps.x - b.cx;
    const originY = ps.y - b.cy;
    const anchorX = originX + b.pts[0][0];
    const anchorY = originY + b.pts[0][1];

    // Quick reject: only consider board-snap if within the board's
    // pixel bounding box (plus a small margin) — otherwise this is
    // a free drop in the open tray area.
    const m = HEX_RADIUS;
    if (anchorX < LAYOUT.boardMinX - m || anchorX > LAYOUT.boardMaxX + m ||
        anchorY < LAYOUT.boardMinY - m || anchorY > LAYOUT.boardMaxY + m) {
        return null;
    }

    // Convert world anchor position into the raw (unshifted) board-local
    // space that boardToPixel(row,col) operates in.
    const localX = anchorX - BOARD_ORIGIN.x;
    const localY = anchorY - BOARD_ORIGIN.y;

    // Invert boardToPixel: x=1.5*R*row → row; y=√3*R*(col-row/2) → col
    const rowF = localX / (1.5 * HEX_RADIUS);
    const colF = localY / (Math.sqrt(3) * HEX_RADIUS) + rowF / 2;

    // Search a neighbourhood of candidate cells (axial rounding can be ambiguous at corners)
    const candidates = [];
    for (let dr = -1; dr <= 1; dr++)
        for (let dc = -1; dc <= 1; dc++)
            candidates.push([Math.round(rowF) + dr, Math.round(colF) + dc]);

    // Pick the candidate whose centre is closest to the anchor point
    let best = null, bestDist = Infinity;
    for (const [row, col] of candidates) {
        const [cx2, cy2] = boardToPixel(row, col);
        const dist = Math.hypot(localX - cx2, localY - cy2);
        if (dist < bestDist) { bestDist = dist; best = [row, col]; }
    }

    // Reject if the anchor is clearly between cells (more than one hex-radius away)
    if (!best || bestDist > HEX_RADIUS * 1.5) return null;

    const [row, col] = best;

    // Anchor the piece so its first cell lands on [row, col]
    const [dr0, dc0] = cells[0];
    const anchorRow = row - dr0;
    const anchorCol = col - dc0;

    // Validate all piece cells
    const toBoardCoords = cells.map(([dr, dc]) => [anchorRow + dr, anchorCol + dc]);
    let valid = true;
    for (const [r, c] of toBoardCoords) {
        if (r < 0 || r >= manualState.length ||
            c < 0 || c >= manualState[0].length ||
            manualState[r][c] !== 0) {
            valid = false;
            break;
        }
    }

    return { row, col, anchorRow, anchorCol, valid };
}

/* ═══════════════════════════════════════════════════════════
   UI wiring
═══════════════════════════════════════════════════════════ */
const selMonth   = document.getElementById("selMonth");
const selDay     = document.getElementById("selDay");
const selWeekday = document.getElementById("selWeekday");
const outputEl   = document.getElementById("output");
const solveBtn   = document.getElementById("solveButton");
const spinner2   = document.getElementById("spinner");
const solveIcon  = document.getElementById("solveIcon");
const legendEl   = document.getElementById("legend");
const puzzleBox  = document.getElementById("puzzleBox");

(function buildDays() {
    for (let d = 1; d <= 31; d++) {
        const opt = document.createElement("option");
        opt.value = opt.textContent = String(d);
        selDay.appendChild(opt);
    }
})();

function applyToday() {
    const n = new Date();
    selMonth.value   = MONTHS[n.getMonth()];
    selDay.value     = String(n.getDate());
    selWeekday.value = WEEKDAYS[n.getDay()];
}
applyToday();

function setStatus(msg, cls = "") { outputEl.textContent = msg; outputEl.className = cls; }

initSVG();

function drawInitial() {
    legendEl.innerHTML = "";
    puzzleBox.style.opacity = "1";
    initManualState();
    redrawBoard();
    renderFreePieces();
    setStatus(`${selWeekday.value} · ${selMonth.value} ${selDay.value} — drag pieces onto the board`);
}

drawInitial();

selMonth.addEventListener("change",   drawInitial);
selDay.addEventListener("change",     drawInitial);
selWeekday.addEventListener("change", drawInitial);
document.getElementById("todayBtn").addEventListener("click", () => { applyToday(); drawInitial(); });
document.getElementById("resetBtn").addEventListener("click", () => { legendEl.innerHTML = ""; drawInitial(); });

solveBtn.addEventListener("click", () => {
    const m = selMonth.value, d = selDay.value, w = selWeekday.value;
    solveBtn.disabled = true;
    spinner2.style.display = "block";
    solveIcon.style.display = "none";
    setStatus(`Solving for ${w} · ${m} ${d}...`, "loading");
    legendEl.innerHTML = "";

    requestAnimationFrame(() => setTimeout(() => {
        const result = solveCalendar(m, d, w);
        solveBtn.disabled = false;
        spinner2.style.display = "none";
        solveIcon.style.display = "block";

        if (!result.solved) { setStatus(`No solution found for ${w} · ${m} ${d}`, "error"); return; }

        isAutoSolved = true;
        document.getElementById("freeLayer").innerHTML = "";
        drawBoard(result.solution);
        setStatus(`✓ Solved! — ${w} · ${m} ${d}`, "solved");
        buildLegend();
    }, 30));
});

function buildLegend() {
    legendEl.innerHTML = "";
    PIECE_NAMES.forEach((name, i) => {
        const color = COLORS[String(i + 1)];
        if (!color) return;
        const item = document.createElement("div"); item.className = "li";
        const sw = document.createElement("div"); sw.className = "sw"; sw.style.background = color;
        item.appendChild(sw);
        item.appendChild(document.createTextNode(name));
        legendEl.appendChild(item);
    });
    const exp = document.createElement("div"); exp.className = "li";
    const sw2 = document.createElement("div"); sw2.className = "sw";
    sw2.style.background = "black"; sw2.style.border = "1px solid #666";
    exp.appendChild(sw2);
    exp.appendChild(document.createTextNode("Exposed (month / day / weekday)"));
    legendEl.appendChild(exp);
}
</script>
